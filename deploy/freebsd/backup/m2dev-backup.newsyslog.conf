# m2dev backup log rotation (docs/backup.md). Install as /usr/local/etc/newsyslog.conf.d/m2dev-backup.conf.
# Rotate at 1 MB, keep 5 bzip2 copies; C: create the file if it is missing; N: signal no process (the backup
# scripts open the log for each line).
# logfilename			[owner:group]	mode	count	size	when	flags
/var/log/m2dev-backup.log	root:wheel	640	5	1024	*	JCN
