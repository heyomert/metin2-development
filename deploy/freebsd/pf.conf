# m2dev — FreeBSD pf rules
#
# Purpose: the core-to-core (P2P) ports have NO authentication in the game code
# (server-src/src/game/desc_manager.cpp:108-134) and a peer can e.g. make a core
# shut down (server-src/src/game/input_p2p.cpp:470-474). Original Metin2 design
# assumes those ports are only reachable by the server's own processes. This file
# makes that assumption true. See docs/roadmap.md K-1 and docs/production-checklist.md.
#
# Scope: a targeted block only. Everything not matched below keeps the default
# "pass", so SSH, game ports and the database are unaffected. A full default-deny
# host firewall is a separate production-hardening item.
#
# Install:  cp deploy/freebsd/pf.conf /etc/pf.conf
#           pfctl -nf /etc/pf.conf        # syntax check first
#           sysrc pf_enable=YES pf_rules=/etc/pf.conf
#           service pf start
#
# ---- EDIT PER ENVIRONMENT ---------------------------------------------------
# ext_if          : interface that carries the IP the cores bind P2P to (the
#                   game's PUBLIC_IP; check `sockstat -4l | grep 12011`).
# <m2dev_servers> : every IP of OUR game servers allowed to reach the P2P ports
#                   (the server itself; add the other servers if cores ever run
#                   on more than one machine).
#
# Test VM values:
ext_if = "em1"
table <m2dev_servers> persist { 127.0.0.1, 192.168.56.20 }
# Production: set the NIC name and the rented server's public IP(s) here, then
# run the external reachability gate in docs/production-checklist.md.
# -----------------------------------------------------------------------------

# P2P ports = 12000 + channel*10 + core  (server/install.py:27-29), CH99 -> 12991
p2p_ports = "12000:12999"

# Traffic a host sends to its own IP travels over lo0; do not filter it.
set skip on lo0

# Block P2P from anyone who is not one of our servers. `drop` = silent.
# NOTE: negate a TABLE, never an inline list: `from ! { a, b }` matches everyone
# in pf (each element is negated separately).
block drop in quick on $ext_if proto tcp from ! <m2dev_servers> to any port $p2p_ports
